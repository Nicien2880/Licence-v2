    discovery_rules:
    - uuid: 7b6c8f5703ca49d7a4c296df6508f819
      name: '3PAR: Node discovery'
      type: DEPENDENT
      key: 3par.node.discovery
      delay: '0'
      lifetime: 7d
      master_item:
        key: 3par/3par_perf_test.py["{$3PAR.PROFILE}"]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var d = JSON.parse(value);\n\nfunction getRows(d, section) {\n    if (d.parsed && d.parsed[section] && Array.isArray(d.parsed[section]))\
          \ return d.parsed[section];\n    return [];\n}\nfunction pick(r, names) {\n    for (var i = 0; i < names.length;\
          \ i++) {\n        var k = names[i];\n        if (r[k] !== undefined && r[k] !== null && String(r[k]) !== \"\") {\n\
          \            return {key: k, value: r[k]};\n        }\n    }\n    return null;\n}\nfunction toNum(v) {\n    if (v\
          \ === null || v === undefined || String(v).trim() === \"\") throw \"empty value\";\n    var s = String(v).trim().replace(/\\\
