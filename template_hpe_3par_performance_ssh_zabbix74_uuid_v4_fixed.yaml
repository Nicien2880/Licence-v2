      delay: '0'
      master_item:
        key: 3par/3par_perf_test.py["{$3PAR.PROFILE}"]
      history: 7d
      trends: 30d
      value_type: UNSIGNED
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var d = JSON.parse(value);

          var c = d.command_status && d.command_status["showversion"];

          if (!c || c["status"] === undefined || c["status"] === null) return 2;

          return c["status"];

          '
