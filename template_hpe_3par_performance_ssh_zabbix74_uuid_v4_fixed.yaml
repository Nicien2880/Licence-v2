zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: ee2fb3a42f974dcc957b0c2de2e5ad2c
    name: Templates/Storage
  templates:
  - uuid: 497e326666bf4878a431b4c1b86bf001
    template: Template HPE 3PAR Performance SSH
    name: Template HPE 3PAR Performance SSH
    description: Community/custom template for HPE 3PAR StoreServ performance monitoring via the external script 3par_perf_test.py.
      Uses one JSON master item and dependent items/LLD. Parsing is best-effort and may need adjustment after seeing real
      3PAR CLI output.
    groups:
    - name: Templates/Storage
    tags:
    - tag: class
      value: storage
    - tag: target
      value: hpe-3par
    macros:
    - macro: '{$3PAR.PROFILE}'
      value: 3par-prod-01
      description: Profile name. Must match /etc/zabbix/3par/<profile>.conf
    - macro: '{$3PAR.COLLECTOR.NODATA}'
      value: 5m
      description: No-data interval for collector status.
    - macro: '{$3PAR.CPU.WARN}'
      value: '80'
      description: CPU busy warning threshold, percent.
    - macro: '{$3PAR.CPU.HIGH}'
      value: '90'
      description: CPU busy high threshold, percent.
    - macro: '{$3PAR.LATENCY.WARN}'
      value: '20'
      description: Service time/latency warning threshold, ms.
    - macro: '{$3PAR.LATENCY.HIGH}'
      value: '50'
      description: Service time/latency high threshold, ms.
    - macro: '{$3PAR.LATENCY.DISASTER}'
      value: '100'
      description: Service time/latency disaster threshold, ms.
    - macro: '{$3PAR.PD.BUSY.WARN}'
      value: '80'
      description: Physical disk busy warning threshold, percent.
    - macro: '{$3PAR.PD.BUSY.HIGH}'
      value: '90'
      description: Physical disk busy high threshold, percent.
    - macro: '{$3PAR.CPG.USED.WARN}'
      value: '80'
      description: CPG used space warning threshold, percent.
    - macro: '{$3PAR.CPG.USED.HIGH}'
      value: '90'
      description: CPG used space high threshold, percent.
    - macro: '{$3PAR.CPG.FREE.MIN.GB}'
      value: '500'
      description: CPG minimum free space threshold, GB.
    - macro: '{$3PAR.COMMAND.TIME.WARN}'
      value: '20'
      description: Warning threshold for CLI command elapsed time, seconds.
    items:
    - uuid: ab21e109b6374350ba7002f10d142d22
      name: '3PAR: Raw performance data'
      type: EXTERNAL
      key: 3par/3par_perf_test.py["{$3PAR.PROFILE}"]
      delay: 1m
      history: 1d
      trends: '0'
      value_type: TEXT
      description: Master item. Runs 3par_perf_test.py and returns one JSON document.
    - uuid: eacbde3540df489da00787512ff1a2e6
      name: '3PAR: Collector status'
      type: DEPENDENT
      key: 3par.collector.status
      delay: '0'
      master_item:
        key: 3par/3par_perf_test.py["{$3PAR.PROFILE}"]
      history: 7d
      trends: '0'
      value_type: UNSIGNED
      description: 1 = collector finished successfully; 0 = collector failed.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.status
      triggers:
      - uuid: 0f0fcf8e081d401d9fb88120249d24fc
        expression: last(/Template HPE 3PAR Performance SSH/3par.collector.status)=0
        name: '3PAR: Collector failed'
        priority: HIGH
      - uuid: 6fed718c466b4aa7b40e896151cb815b
        expression: nodata(/Template HPE 3PAR Performance SSH/3par.collector.status,{$3PAR.COLLECTOR.NODATA})=1
        name: '3PAR: No performance data'
        priority: HIGH
    - uuid: e20d49f8e2664625893d6a2ddff3949e
      name: '3PAR: Collector error'
      type: DEPENDENT
      key: 3par.collector.error
      delay: '0'
      master_item:
        key: 3par/3par_perf_test.py["{$3PAR.PROFILE}"]
      history: 7d
      trends: '0'
      value_type: TEXT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.error
    - uuid: 35cc72c63f764123869987d880a189d0
      name: '3PAR: Commands total'
      type: DEPENDENT
      key: 3par.commands.total
      delay: '0'
      master_item:
        key: 3par/3par_perf_test.py["{$3PAR.PROFILE}"]
      history: 7d
      trends: 30d
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.commands_total
    - uuid: ab9aac45ae064f06a2781826dcd89d9d
      name: '3PAR: Commands OK'
      type: DEPENDENT
