zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: cbae3b5763424087b22fae02f4422b5a
    name: Templates/SAN
  templates:
  - uuid: 7d26b7e1db84400fbc79121af71ca7eb
    template: Template HPE 3PAR Article-like SSH Summary LIGHT
    name: Template HPE 3PAR Article-like SSH Summary LIGHT
    description: Lightweight HPE 3PAR SSH summary template for Zabbix 7.4. No LLD. Removed duplicate KB/s and RW items; keeps IOPS, MB/s, Svt, Busy, Queue, CPU, collector
      and parser items.
    groups:
    - name: Templates/SAN
    macros:
    - macro: '{$3PAR.ARTICLE.PROFILE}'
      value: 3par-article
      description: 'Profile name: /etc/zabbix/3par/<profile>.conf'
    - macro: '{$3PAR.ARTICLE.NODATA}'
      value: 5m
      description: No data threshold.
    - macro: '{$3PAR.ARTICLE.CPU.WARN}'
      value: '80'
      description: CPU warning threshold, percent.
    - macro: '{$3PAR.ARTICLE.CPU.HIGH}'
      value: '90'
      description: CPU high threshold, percent.
    - macro: '{$3PAR.ARTICLE.SVT.WARN}'
      value: '20'
      description: Service time warning threshold, ms.
    - macro: '{$3PAR.ARTICLE.SVT.HIGH}'
      value: '50'
      description: Service time high threshold, ms.
    - macro: '{$3PAR.ARTICLE.ELAPSED.WARN}'
      value: '45'
      description: Collector elapsed time warning threshold, seconds.
    items:
    - uuid: 358d8614fdb846299128fce82620c51b
      name: '3PAR: Article-like raw JSON'
      type: EXTERNAL
      key: 3par/3par_article_like.py["{$3PAR.ARTICLE.PROFILE}"]
      delay: 1m
      history: 7d
      trends: '0'
      value_type: TEXT
      timeout: 60s
      description: Master item. Runs 3par_article_like.py and receives one compact JSON with CPU, VV, VLUN, ports and physical disks summary. No LLD.
      tags:
      - tag: component
        value: collector
      - tag: metric
        value: raw
    - uuid: c1632bf5b1a649fca6ceb5ae3e55e7ff
      name: '3PAR: Collector status'
      type: DEPENDENT
      key: 3par.article.status
      delay: '0'
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      description: 1 = collector OK, 0 = required collector command failed.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.status
      master_item:
        key: 3par/3par_article_like.py["{$3PAR.ARTICLE.PROFILE}"]
      tags:
      - tag: component
        value: collector
      - tag: metric
        value: status
      triggers:
      - uuid: d34e0019fd214eaeb6145ce1ec19de40
        expression: last(/Template HPE 3PAR Article-like SSH Summary LIGHT/3par.article.status)=0
        name: '3PAR: Article-like collector failed'
        priority: HIGH
        description: Collector returned status=0.
      - uuid: c43b488366424e63b23285a02eca4cb3
        expression: nodata(/Template HPE 3PAR Article-like SSH Summary LIGHT/3par.article.status,{$3PAR.ARTICLE.NODATA})=1
        name: '3PAR: Article-like collector has no data'
        priority: HIGH
        description: No data from collector.
    - uuid: 195d21b139934a419e4b8ca318feadae
      name: '3PAR: Collector error'
      type: DEPENDENT
      key: 3par.article.error
      delay: '0'
