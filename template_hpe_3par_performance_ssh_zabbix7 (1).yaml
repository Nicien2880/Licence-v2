    discovery_rules:
    - uuid: bec4e39673fb52b28db0d23104cf080d
      name: '3PAR: Node discovery'
      type: DEPENDENT
      key: 3par.node.discovery
      delay: '0'
      lifetime: 7d
      master_item:
        key: 3par/3par_perf_test.py["{$3PAR.PROFILE}"]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);

          function getRows(d, section) {
              if (d.parsed && d.parsed[section] && Array.isArray(d.parsed[section])) return d.parsed[section];
              return [];
          }
          function pick(r, names) {
              for (var i = 0; i < names.length; i++) {
                  var k = names[i];
                  if (r[k] !== undefined && r[k] !== null && String(r[k]) !== "") {
                      return {key: k, value: r[k]};
                  }
              }
              return null;
          }
          function toNum(v) {
              if (v === null || v === undefined || String(v).trim() === "") throw "empty value";
              var s = String(v).trim().replace(/\s+/g, "");
              if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) {
                  s = s.replace(/,/g, "");
              } else {
                  s = s.replace(/,/g, ".");
              }
              s = s.replace(/[^0-9.\-]/g, "");
              if (s === "" || s === "-" || s === ".") throw "not numeric: " + v;
              var n = Number(s);
              if (isNaN(n)) throw "not numeric: " + v;
              return n;
          }
          function getId(r, names, fallback) {
              var p = pick(r, names);
              if (p) return String(p.value);
              return String(fallback);
          }
          function convertByKey(num, key, kind) {
              key = String(key || "").toLowerCase();
              if (kind === "mbps") {
                  if (key.indexOf("kbyte") >= 0 || key.indexOf("kb_s") >= 0 || key.indexOf("kbytes") >= 0) return num / 1024;
                  if ((key.indexOf("byte") >= 0 || key === "bytes_s") && key.indexOf("kbyte") < 0 && key.indexOf("mbyte") < 0) return num / 1048576;
                  return num;
              }
              if (kind === "gb") {
                  if (key.indexOf("mb") >= 0 || key.indexOf("mib") >= 0) return num / 1024;
                  if (key.indexOf("kb") >= 0 || key.indexOf("kib") >= 0) return num / 1048576;
                  if (key.indexOf("bytes") >= 0 || key === "b") return num / 1073741824;
                  return num;
              }
              return num;
          }

          var rows = getRows(d, "statcpu");
          var out = [];
          for (var i = 0; i < rows.length; i++) {
              var id = getId(rows[i], ['node','n','id','node_id'], i);
              if (true && String(id).toLowerCase() === "total") continue;

              out.push({"{#NODE}": String(id)});
          }
          return JSON.stringify({"data": out});
